[project]
name = "frontier-bench-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
