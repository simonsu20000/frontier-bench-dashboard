# Benchmarks vendors cite that are NOT (yet) in the scored catalog, plus extra aliases
# for catalog benchmarks. `strict: true` names are matched only as exact table cells
# (never in prose) because the bare word is ambiguous.
#
#   - id: <key>            canonical key (catalog id when it exists there)
#     name: <display>
#     aliases: [...]       spellings as they appear in model cards / posts
#     domain: <domain id from config/radar.yml>
#     url: <official page>
#     released: YYYY-MM-DD (optional)
