# Provenance classification for rows that carry a source link.
#
# The dashboard only shows third-party scores. A row is classified as:
#   official_leaderboard  - the benchmark maintainer's own leaderboard
#   third_party           - an independent evaluator / paper
#   vendor_reported       - published by the organisation that built the model (excluded)
#   unclassified          - unknown domain (excluded; listed in data/unmatched_report.json)

include_vendor_reported: false
include_unclassified: false

# domain -> display name. Subdomains match too (metr.org matches blog.metr.org).
benchmark_hosts:
  tbench.ai: Terminal-Bench leaderboard
  arcprize.org: ARC Prize leaderboard
