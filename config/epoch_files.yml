# Epoch AI bundle specifics.
#
# unmapped_files: files whose benchmark_metadata row has no source_file /
# score_column (20 of them as of 2026-09). Keys are csv filenames in the zip.
unmapped_files:
  cursorbench_external.csv:        {benchmark: CursorBench,        score_column: Score}
  gbaeval_external.csv:            {benchmark: GBAEval,            score_column: Overall score}
  critpt_external.csv:             {benchmark: CritPt,             score_column: Accuracy}
  bool_q_external.csv:             {benchmark: BoolQ,              score_column: Score}
  common_sense_qa_2_external.csv:  {benchmark: CSQA2,              score_column: Score}
  forecastbench_external.csv:      {benchmark: ForecastBench,      score_column: Overall score, scale: 0.01}
  live_bench_external.csv:         {benchmark: LiveBench,          score_column: Global average, scale: 0.01}
  video_mme_external.csv:          {benchmark: VideoMME,           score_column: "Overall (no subtitles)"}
  frontiermath_erdos.csv:          {benchmark: FrontierMath-Erdos, score_column: "Best score (across scorers)"}
  gdp_pdf_external.csv:            {benchmark: GDP.pdf,            score_column: GDP.pdf score}
  frontierswe_external.csv:        {benchmark: FrontierSWE,        score_column: Score}
  scicode_external.csv:            {benchmark: SciCode,            score_column: Score}
  webdev_arena_external.csv:       {benchmark: WebDev Arena,       score_column: Arena Score, scale: 1.0}
  blueprint_bench_2_external.csv:  {benchmark: Blueprint-Bench 2,  score_column: Score}
  mindcube_external.csv:           {benchmark: MindCube,           score_column: Overall score}
  spatialviz_bench_external.csv:   {benchmark: SpatialViz-Bench,   score_column: Overall score}
  btf3_external.csv:               {benchmark: BTF-3,              score_column: Pooled score}
  enigma_eval_external.csv:        {benchmark: EnigmaEval,         score_column: Accuracy}
  algotune_external.csv:           {benchmark: AlgoTune,           score_column: Score, scale: 1.0}
  ale_bench_external.csv:          {benchmark: ALE-Bench,          score_column: Performance, scale: 1.0}
  vending_bench_2_external.csv:    {benchmark: Vending-Bench 2,    score_column: Score, scale: 1.0}

# Provenance defaults for external files whose rows carry no Source link.
# type: official_leaderboard | third_party. Rows WITH a link are classified by
# domain in config/sources.yml instead.
file_sources:
