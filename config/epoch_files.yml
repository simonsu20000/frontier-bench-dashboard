default_file_source: {type: third_party, name: "Epoch AI Benchmarking Hub (curated external result)", url: "https://epoch.ai/benchmarks"}

# Where Epoch's own runs link to when no per-row log viewer URL exists.
epoch_run_url: "https://epoch.ai/benchmarks"
