  arc_agi_2_external.csv:         {type: official_leaderboard, name: "ARC Prize leaderboard, via Epoch AI", url: "https://arcprize.org/leaderboard"}
  arc_agi_external.csv:           {type: official_leaderboard, name: "ARC Prize leaderboard, via Epoch AI", url: "https://arcprize.org/leaderboard"}
  terminalbench_external.csv:     {type: official_leaderboard, name: "Terminal-Bench leaderboard, via Epoch AI", url: "https://www.tbench.ai/leaderboard"}
