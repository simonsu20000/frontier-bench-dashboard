  frontierswe_external.csv:       {type: third_party, name: "FrontierSWE, via Epoch AI", url: "https://epoch.ai/benchmarks/frontierswe"}
  apex_agents_external.csv:       {type: official_leaderboard, name: "APEX-Agents leaderboard (Mercor), via Epoch AI", url: "https://epoch.ai/benchmarks/apex-agents"}
